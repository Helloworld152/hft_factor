source:
  input_shm: CTP_MD

engine:
  worker_count: 4
  worker_queue_capacity: 4096
  sink_queue_capacity: 4096

publisher:
  output_shm: FACTOR_MD
  output_capacity: 1048576

factor_graph:
  nodes:
    - id: mid_price
      path: ./bin/plugins/libmid_price_factor.so
      deps: []

    - id: spread
      path: ./bin/plugins/libspread_factor.so
      deps: [mid_price]

    - id: book_imbalance
      path: ./bin/plugins/libbook_imbalance_factor.so
      deps: []

    - id: ret_1_tick
      path: ./bin/plugins/libret_1_tick_factor.so
      deps: [mid_price]
